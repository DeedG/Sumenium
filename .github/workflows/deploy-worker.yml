name: Déployer l'Espace (sumenium.com)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      DISCORD_WEBHOOK_TIRAGE: ${{ secrets.DISCORD_WEBHOOK_TIRAGE }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Vérifier la configuration
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN,"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secret CLOUDFLARE_ACCOUNT_ID,"
          [ -n "$DISCORD_CLIENT_SECRET" ] || missing="$missing secret DISCORD_CLIENT_SECRET,"
          GUILD_ID=$(echo "$GUILD_ID" | tr -d '[:space:]')
          echo "$GUILD_ID" | grep -Eq '^[0-9]{15,22}$' || missing="$missing variable DISCORD_GUILD_ID (identifiant du serveur Discord, uniquement des chiffres),"
          if [ -n "$missing" ]; then
            echo "::error::À ajouter dans Settings > Secrets and variables > Actions :${missing%,}"
            exit 1
          fi

      - run: npm ci

      - name: Base de données D1
        run: |
          GUILD_ID=$(echo "$GUILD_ID" | tr -d '[:space:]')
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="sumenium") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create sumenium
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="sumenium") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Impossible de créer ou trouver la base D1 « sumenium »."; exit 1; }
          sed -i "s/D1_DATABASE_ID/$id/; s/GUILD_ID = \"A_REMPLIR\"/GUILD_ID = \"$GUILD_ID\"/" wrangler.toml
          npx wrangler d1 migrations apply sumenium --remote

      - name: Libérer sumenium.com (enregistrements de la page d'attente IONOS)
        # Le Worker crée lui-même les enregistrements de sumenium.com et www : ceux de la page « domaine non utilisé »
        # d'IONOS, importés par Cloudflare, bloqueraient le déploiement. On ne supprime que ceux-là.
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          zone=$(api "https://api.cloudflare.com/client/v4/zones?name=sumenium.com" | jq -r '.result[0].id // empty')
          [ -n "$zone" ] || { echo "::warning::Zone sumenium.com introuvable avec ce jeton."; exit 0; }
          for name in sumenium.com www.sumenium.com; do
            api "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$name&per_page=50" \
              | jq -r '.result[] | select((.type=="A" and .content=="217.160.0.66") or (.type=="AAAA" and (.content|startswith("2001:8d8:100f:f000"))) or (.type=="CNAME" and (.content|test("ionos"))) ) | .id + " " + .type + " " + .content' \
              | while read -r id type content; do
                  api -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$id" >/dev/null && echo "Supprimé : $name $type $content"
                done
          done

      - name: Déployer le Worker
        run: |
          umask 077
          jq -n --arg s "$DISCORD_CLIENT_SECRET" --arg g "$GITHUB_DISPATCH_TOKEN" --arg w "$DISCORD_WEBHOOK_TIRAGE" --arg b "$BACKUP_TOKEN" \
            '{DISCORD_CLIENT_SECRET:$s} + (if $g != "" then {GITHUB_DISPATCH_TOKEN:$g} else {} end)
             + (if $w != "" then {DISCORD_WEBHOOK_TIRAGE:$w} else {} end) + (if $b != "" then {BACKUP_TOKEN:$b} else {} end)' > "$RUNNER_TEMP/secrets.json"
          set +e
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/secrets.json"
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E "ERROR|✘|code: [0-9]+|Authentication|permission" "$RUNNER_TEMP/deploy.log" | head -5 | tr '\n' ' ' | cut -c1-600)
            echo "::error::Déploiement refusé par Cloudflare : ${msg:-voir le journal}"
            exit 1
          fi
          [ -n "$DISCORD_WEBHOOK_TIRAGE" ] || echo "::notice::Secret DISCORD_WEBHOOK_TIRAGE absent : pas d'annonce du tirage des usines sur Discord."
          [ -n "$BACKUP_TOKEN" ] || echo "::notice::Secret BACKUP_TOKEN absent : la sauvegarde hebdomadaire du NAS sera refusée."
          [ -n "$GITHUB_DISPATCH_TOKEN" ] || echo "::warning::Secret GH_DISPATCH_TOKEN absent : la mise à jour du site dépend du cron de GitHub (souvent en retard)."
          echo "::notice::Espace déployé sur https://sumenium.com"
