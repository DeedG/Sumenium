name: Mise à jour du site

on:
  schedule:
    - cron: "*/5 * * * *"    # secours : le Worker Cloudflare déclenche aussi la mise à jour toutes les 5 min
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Icônes des récompenses (en cache)
        uses: actions/cache@v4
        with:
          path: |
            site/icons
            work/client.jar
          key: icons-v2-${{ hashFiles('site/catalog.json') }}
          restore-keys: icons-v2-
      - name: Extraction des icônes manquantes
        run: python scripts/icons.py
      - name: Lecture du serveur en SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_ROOT: ${{ secrets.SFTP_ROOT }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: python scripts/update.py
      - name: Icônes des objets en boutique
        run: python scripts/icons.py
      - name: Version des scripts (le navigateur prend la nouvelle version tout de suite)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}-$(date +%s)/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
