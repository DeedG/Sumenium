name: Mise à jour du site

on:
  schedule:
    - cron: "*/5 * * * *"    # secours : le Worker Cloudflare déclenche aussi la mise à jour toutes les 5 min
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # un passage bloqué ne garde pas une session SFTP ouverte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Icônes des récompenses (en cache)
        uses: actions/cache@v4
        with:
          path: |
            site/icons
            work/client.jar
          key: icons-v2-${{ hashFiles('site/catalog.json') }}
          restore-keys: icons-v2-
      - name: Extraction des icônes manquantes
        run: python scripts/icons.py
      - name: Têtes des skins (en cache)
        uses: actions/cache@v4
        with:
          path: |
            site/heads
            work/heads-meta.json
          key: heads-v1-${{ github.run_id }}
          restore-keys: heads-v1-
      - name: Lecture du serveur en SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_ROOT: ${{ secrets.SFTP_ROOT }}
          SFTP_HOSTKEY: ${{ secrets.SFTP_HOSTKEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Jeton d'envoi vers l'Espace. Tant que le secret INGEST_TOKEN n'existe pas, il est dérivé du secret Discord
          # (qui n'est alors plus transmis dès qu'INGEST_TOKEN est créé).
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.INGEST_TOKEN == '' && secrets.DISCORD_CLIENT_SECRET || '' }}
        run: python scripts/update.py
      - name: Têtes des skins (API Mojang, une fois par jour et par joueur)
        run: python scripts/heads.py || echo "::warning::Têtes des skins non mises à jour"
      - name: Icônes des objets en boutique
        run: python scripts/icons.py
      - name: Version des scripts (le navigateur prend la nouvelle version tout de suite)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}-$(date +%s)/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages se fige parfois : chaque déploiement est « réussi » mais le site garde une ancienne version
  # (vu le 7 nov. 2026 : 17 h sans mise à jour). Le déploiement réutilise le SHA du dernier commit comme numéro de
  # version ; un nouveau commit (vide) débloque. On vérifie donc que le site en ligne a bien les données du jour.
  verifier:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Le site en ligne est-il à jour ?
        id: live
        run: |
          for i in 1 2 3 4 5 6; do
            u=$(curl -fsS "https://deedg.github.io/Sumenium/data.json?v=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('updated',''))" || true)
            age=$(python3 -c "from datetime import datetime,timezone as t;import sys;s='$u';print(int((datetime.now(t.utc)-datetime.fromisoformat(s)).total_seconds()//60) if s else 9999)")
            echo "Données en ligne : $u (il y a $age min)"
            if [ "$age" -lt 25 ]; then echo "fige=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "fige=1" >> "$GITHUB_OUTPUT"
          echo "::warning title=Site figé::GitHub Pages sert des données vieilles de $age min malgré le déploiement : commit vide pour débloquer"
      - uses: actions/checkout@v4
        if: steps.live.outputs.fige == '1'
      - name: Commit vide (nouveau numéro de version pour GitHub Pages)
        if: steps.live.outputs.fige == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Débloque GitHub Pages (site figé)"
          git push
