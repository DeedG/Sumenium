name: Débloquer la mise à jour du site

# Une exécution de « Mise à jour du site » peut rester bloquée (déploiement GitHub Pages « waiting » sans fin) :
# comme elles partagent le même groupe de concurrence, toutes les suivantes sont annulées et le site ne bouge plus.
# Ce workflow (autre groupe) annule une exécution bloquée depuis plus de 20 minutes.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/debloque.yml"]

permissions:
  actions: write

concurrency:
  group: debloque
  cancel-in-progress: true

jobs:
  debloque:
    runs-on: ubuntu-latest
    steps:
      - name: Annuler les exécutions bloquées
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          for st in waiting in_progress queued; do
            gh api "repos/$REPO/actions/workflows/update.yml/runs?status=$st&per_page=20" \
              --jq '.workflow_runs[] | "\(.id) \(.created_at)"' | while read id created; do
              age=$(( now - $(date -u -d "$created" +%s) ))
              if [ "$age" -gt 1200 ]; then
                echo "::warning title=Site débloqué::exécution $id ($st depuis $((age/60)) min) annulée"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || true
                sleep 20
                gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" || true
              fi
            done
          done
