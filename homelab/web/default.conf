# Serveur de la carte : fichiers statiques en lecture seule, rien d'autre.
# Les visiteurs arrivent par le tunnel Cloudflare ; l'IP réelle est dans CF-Connecting-IP.
limit_req_zone $http_cf_connecting_ip zone=carte:10m rate=40r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    charset utf-8;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=carte burst=400 nodelay;
    limit_req_status 429;

    location / {
        include /etc/nginx/carte/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Tuiles : une tuile absente n'est pas une erreur pour BlueMap (204 = vide)
    location ~ ^/maps/[^/]+/tiles/ {
        include /etc/nginx/carte/headers.conf;
        add_header Cache-Control "public, max-age=900" always;
        try_files $uri =204;
    }

    # Marqueurs (bordure, brouillard) : relus souvent par la carte
    location ~ ^/maps/[^/]+/live/ {
        include /etc/nginx/carte/headers.conf;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =204;
    }

    location /assets/ {
        include /etc/nginx/carte/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Rien de caché ni de PHP
    location ~ (^|/)\. { return 404; }
    location ~ \.php$ { return 404; }
}
