# En-têtes de sécurité (répétés dans chaque bloc location, sinon nginx les oublie)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://deedg.github.io https://sumenium.alheon.fr" always;
