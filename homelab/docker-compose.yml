# Carte Suménium : rendu BlueMap + petit serveur web, exposés uniquement via le tunnel Cloudflare.
name: sumenium-carte

services:
  carte:
    build: ./carte
    container_name: sumenium-carte
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 9g
    cpus: ${CARTE_CPUS:-8}
    networks: [carte]

  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: sumenium-carte-web
    restart: unless-stopped
    volumes:
      - ./data/web:/usr/share/nginx/html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/headers.conf:/etc/nginx/carte/headers.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    # Accessible seulement depuis ce PC (pas depuis le réseau local ni Internet)
    ports:
      - "127.0.0.1:8100:8080"
    networks: [carte]

  # Sauvegarde hebdomadaire de la base du site (fiches, factions, usines, votes…) dans ./sauvegardes
  sauvegarde:
    image: python:3.12-alpine
    container_name: sumenium-sauvegarde
    restart: unless-stopped
    command: ["python", "-u", "/app/sauvegarde.py"]
    environment:
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
      SITE_URL: ${SITE_URL:-https://sumenium.com}
      BACKUP_KEEP: ${BACKUP_KEEP:-12}
      BACKUP_WEEKDAY: ${BACKUP_WEEKDAY:-0}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      TZ: ${TZ:-Europe/Paris}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./sauvegarde:/app:ro
      - ./sauvegardes:/sauvegardes
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m

networks:
  carte:
    name: carte
